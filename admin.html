<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄音乐报 · 管理后台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #fdfcf8; --bg-soft: #f5f0e6; --bg-dark: #1a1a2e;
  --text: #111; --text-muted: #555; --text-light: #888;
  --red: #c41e1e; --dark-blue: #1f2d4a; --gold: #b8443c;
  --green: #27ae60; --border: #ddd;
  --serif: "Noto Serif SC","Songti SC",serif;
  --sans: "Noto Sans SC","PingFang SC",sans-serif;
  --display: "Playfair Display","Georgia",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px}

.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:300px;background:var(--bg-soft);border-right:2px solid var(--text);display:flex;flex-direction:column;flex-shrink:0}
.sb-header{padding:14px 16px;border-bottom:1px solid var(--border)}
.sb-title{font-family:var(--display);font-size:1rem;font-weight:900;color:var(--red);margin-bottom:4px}
.sb-sub{font-size:.65rem;color:var(--text-muted)}
.sb-search{width:100%;background:var(--bg);border:1px solid var(--border);padding:6px 10px;font-size:12px;outline:none;margin-top:8px;font-family:var(--sans)}
.sb-search:focus{border-color:var(--red)}
.sb-stats{display:flex;gap:10px;margin-top:8px;font-size:.65rem;color:var(--text-muted)}
.sb-stats span{color:var(--red);font-weight:700;font-family:var(--display)}

.sb-list{flex:1;overflow-y:auto}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-bottom:1px solid #eee;transition:background .15s}
.sb-item:hover{background:var(--bg)}
.sb-item.active{background:var(--bg);border-left:3px solid var(--red)}
.sb-item-cover{width:36px;height:36px;flex-shrink:0;overflow:hidden;background:#ddd}
.sb-item-cover img{width:100%;height:100%;object-fit:cover}
.sb-item-ph{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#ddd}
.sb-item-info{flex:1;min-width:0}
.sb-item-title{font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item-sub{font-size:.6rem;color:var(--text-muted);margin-top:1px}
.sb-badge{font-size:.55rem;padding:1px 5px;border-radius:2px;color:#fff;font-weight:600}
.sb-date-sep{padding:6px 14px;font-family:var(--display);font-size:.7rem;font-weight:700;color:var(--text-muted);background:#e8e5df;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}

.sb-filter{padding:8px 14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px}
.sb-filter-tag{font-size:.6rem;padding:2px 8px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:none;color:var(--text-muted)}
.sb-filter-tag.active{background:var(--red);color:#fff;border-color:var(--red)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:12px 20px;border-bottom:2px solid var(--text);display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
.main-title{font-family:var(--serif);font-size:1.1rem;font-weight:700}
.main-actions{display:flex;gap:6px}
.btn{padding:6px 14px;border:1px solid var(--border);background:var(--bg);font-size:.7rem;cursor:pointer;font-family:var(--sans);border-radius:2px;transition:all .15s}
.btn:hover{background:var(--bg-soft);border-color:var(--text)}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn-primary:hover{background:#a01818}

/* Stats Bar */
.stats-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.stat-cell{background:var(--bg);padding:12px 16px;text-align:center}
.stat-num{font-family:var(--display);font-size:1.5rem;font-weight:900;color:var(--text)}
.stat-num.red{color:var(--red)}
.stat-label{font-size:.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px}
.tab{padding:8px 16px;font-size:.75rem;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--red);border-bottom-color:var(--red)}

.tab-content{flex:1;overflow-y:auto;padding:20px}

/* Song Detail */
.detail-grid{display:grid;grid-template-columns:280px 1fr;gap:24px}
.detail-cover{width:280px;height:280px;overflow:hidden;background:var(--bg-soft);border:1px solid var(--border)}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-cover-ph{width:280px;height:280px;display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--bg-soft)}
.detail-info h2{font-family:var(--serif);font-size:1.4rem;margin-bottom:8px}
.detail-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.meta-item{font-size:.7rem;color:var(--text-muted)}
.meta-badge{display:inline-block;padding:2px 8px;border-radius:2px;color:#fff;font-size:.65rem;font-weight:600}
.detail-section{margin-top:16px}
.detail-section-title{font-size:.75rem;font-weight:700;border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:8px;font-family:var(--serif)}
.detail-lyrics{font-family:var(--serif);font-size:.8rem;line-height:1.8;color:var(--text-muted);white-space:pre-wrap;max-height:300px;overflow-y:auto;background:var(--bg-soft);padding:12px;border:1px solid var(--border)}

.audio-player{margin-top:12px;display:flex;align-items:center;gap:8px}
.audio-player audio{flex:1;height:32px}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th{text-align:left;padding:8px 12px;border-bottom:2px solid var(--text);font-family:var(--display);font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;background:var(--bg-soft)}
td{padding:8px 12px;border-bottom:1px solid #eee}
tr:hover{background:var(--bg-soft)}
.td-cover{width:40px;height:40px;overflow:hidden}
.td-cover img{width:100%;height:100%;object-fit:cover}

/* Pipeline Status */
.pipeline{display:flex;gap:20px;margin-bottom:20px}
.pipe-card{flex:1;background:var(--bg);border:1px solid var(--border);padding:16px;text-align:center}
.pipe-card.ok{border-left:4px solid var(--green)}
.pipe-card.warn{border-left:4px solid var(--gold)}
.pipe-card.err{border-left:4px solid var(--red)}
.pipe-name{font-family:var(--serif);font-size:.85rem;font-weight:700;margin-bottom:4px}
.pipe-status{font-size:.65rem;color:var(--text-muted)}
.pipe-time{font-family:var(--display);font-size:1.1rem;font-weight:700;margin:4px 0}
.pipe-next{font-size:.6rem;color:var(--text-light)}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-header">
      <div class="sb-title">🍅 番茄音乐报</div>
      <div class="sb-sub">管理后台 · 番茄专项生产线</div>
      <input class="sb-search" type="text" id="searchInput" placeholder="搜索歌名..." oninput="renderList()">
      <div class="sb-stats" id="sbStats"></div>
    </div>
    <div class="sb-list" id="sbList"></div>
    <div class="sb-filter" id="sbFilter"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <div class="main-title" id="mainTitle">概览</div>
      <div class="main-actions">
        <button class="btn" onclick="rescan()">🔄 扫描</button>
        <button class="btn" onclick="rebuild()">🔨 构建</button>
        <button class="btn btn-primary" onclick="openSite()">↗ 访问站点</button>
      </div>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview',this)">📊 概览</div>
      <div class="tab" onclick="switchTab('songs',this)">🎵 歌曲管理</div>
      <div class="tab" onclick="switchTab('pipeline',this)">⚙️ 生产状态</div>
    </div>
    <div class="tab-content" id="tabContent"></div>
  </div>
</div>

<script>
var allSongs = [];
var currentTab = 'overview';
var currentSlug = null;
var activeGenre = 'all';
var GENRES = [
  {code:'dance',label:'广场舞',icon:'💃',color:'#e74c5e'},
  {code:'viral_pop',label:'洗脑情歌',icon:'🍬',color:'#f39c12'},
  {code:'sad',label:'伤感情绪',icon:'🌧️',color:'#3498db'},
  {code:'guofeng',label:'国风古风',icon:'🏮',color:'#9b59b6'},
  {code:'hometown',label:'家乡励志',icon:'🏠',color:'#27ae60'}
];

async function loadSongs() {
  try {
    const resp = await fetch('/api/songs');
    const data = await resp.json();
    allSongs = data.songs || [];
  } catch(e) {
    allSongs = [];
  }
  renderStats();
  renderFilters();
  renderList();
  renderTab();
}

function renderStats() {
  var total = allSongs.length;
  var today = new Date().toISOString().slice(0,10);
  var todayCount = allSongs.filter(function(s){return s.date === today}).length;
  var genres = {};
  GENRES.forEach(function(g){genres[g.code] = allSongs.filter(function(s){return s.genre_code === g.code}).length});

  document.getElementById('sbStats').innerHTML = '共 <span>'+total+'</span> 首 · 今日 <span>'+todayCount+'</span>';

  var html = '<div class="stat-cell"><div class="stat-num red">'+total+'</div><div class="stat-label">总曲数</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">'+todayCount+'</div><div class="stat-label">今日</div></div>';
  GENRES.forEach(function(g){
    html += '<div class="stat-cell"><div class="stat-num" style="color:'+g.color+'">'+genres[g.code]+'</div><div class="stat-label">'+g.icon+' '+g.label+'</div></div>';
  });
  document.getElementById('statsBar').innerHTML = html;
}

function renderFilters() {
  var html = '';
  html += '<div class="sb-filter-tag '+(activeGenre==='all'?'active':'')+'" onclick="setGenre(\'all\')">全部</div>';
  GENRES.forEach(function(g){
    var count = allSongs.filter(function(s){return s.genre_code === g.code}).length;
    html += '<div class="sb-filter-tag '+(activeGenre===g.code?'active':'')+'" onclick="setGenre(\''+g.code+'\')">'+g.icon+' '+g.label+'</div>';
  });
  document.getElementById('sbFilter').innerHTML = html;
}

function setGenre(code) { activeGenre = code; renderFilters(); renderList(); }

function renderList() {
  var search = (document.getElementById('searchInput').value || '').toLowerCase();
  var filtered = allSongs.filter(function(s){
    var matchG = activeGenre === 'all' || s.genre_code === activeGenre;
    var matchS = !search || s.title.toLowerCase().indexOf(search) >= 0;
    return matchG && matchS;
  });

  // Group by date
  var byDate = {};
  filtered.forEach(function(s){
    var d = s.date || '未知';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(s);
  });
  var dates = Object.keys(byDate).sort().reverse();

  var html = '';
  if (dates.length === 0) {
    html = '<div style="text-align:center;padding:40px 20px;color:#888;font-size:.8rem">暂无歌曲<br><span style="font-size:.7rem">等待番茄专项生产线启动</span></div>';
  }
  dates.forEach(function(d){
    html += '<div class="sb-date-sep">'+formatDate(d)+' · '+byDate[d].length+' 首</div>';
    byDate[d].forEach(function(s){
      var g = GENRES.find(function(x){return x.code === s.genre_code}) || {icon:'🍅',color:'#c41e1e',label:''};
      var active = s.slug === currentSlug ? ' active' : '';
      var cover = s.cover && s.cover.path ? '<img src="/music/'+encodeURIComponent(getRelPath(s))+'">' : '<div class="sb-item-ph">'+g.icon+'</div>';
      html += '<div class="sb-item'+active+'" onclick="selectSong(\''+s.slug+'\')">'+
        '<div class="sb-item-cover">'+cover+'</div>'+
        '<div class="sb-item-info"><div class="sb-item-title">'+esc(s.title)+'</div>'+
        '<div class="sb-item-sub">'+g.icon+' '+g.label+(s.duration?' · '+fmtTime(s.duration):'')+'</div></div>'+
        '<span class="sb-badge" style="background:'+g.color+'">'+(s.mp3?'✅':'')+'</span>'+
        '</div>';
    });
  });
  document.getElementById('sbList').innerHTML = html;
}

function getRelPath(s) {
  if (s.cover && s.cover.all_covers && s.cover.all_covers.length) {
    var p = s.cover.all_covers[0];
    var parts = p.split('/番茄音乐/');
    return parts.length > 1 ? parts[parts.length-1] : '';
  }
  return '';
}

function selectTab(tab) {
  currentTab = tab;
  renderTab();
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  renderTab();
}

function selectSong(slug) {
  currentSlug = slug;
  currentTab = 'songs';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.tab')[1].classList.add('active');
  renderList();
  renderTab();
}

function renderTab() {
  var c = document.getElementById('tabContent');
  if (currentTab === 'overview') {
    document.getElementById('mainTitle').textContent = '📊 概览';
    c.innerHTML = renderOverview();
  } else if (currentTab === 'songs') {
    document.getElementById('mainTitle').textContent = '🎵 歌曲管理';
    c.innerHTML = renderSongDetail();
  } else if (currentTab === 'pipeline') {
    document.getElementById('mainTitle').textContent = '⚙️ 生产状态';
    c.innerHTML = renderPipeline();
  }
}

function renderOverview() {
  if (allSongs.length === 0) {
    return '<div style="text-align:center;padding:80px 20px;color:#888">'+
      '<div style="font-size:48px;margin-bottom:16px">📰</div>'+
      '<div style="font-family:var(--serif);font-size:1.2rem;margin-bottom:8px">番茄音乐报创刊号即将发行</div>'+
      '<div style="font-size:.8rem">生产线 Task T-A/T-A\'/T-B 每天 08:00/08:30/09:00 自动运行</div>'+
      '<div style="font-size:.7rem;margin-top:12px;color:#aaa">每日产出 5 首 · 5 种曲风各 1 首</div></div>';
  }

  var today = new Date().toISOString().slice(0,10);
  var todaySongs = allSongs.filter(function(s){return s.date === today});
  var html = '<div class="detail-section"><div class="detail-section-title">今日产出 ('+todaySongs.length+'/5)</div></div>';
  html += '<div class="today-grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">';
  GENRES.forEach(function(g){
    var s = todaySongs.find(function(x){return x.genre_code === g.code});
    if (s) {
      var cover = s.cover && s.cover.path ? '<img src="/music/'+encodeURIComponent(getRelPath(s))+'" style="width:100%;aspect-ratio:1;object-fit:cover">' : '<div style="width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem;background:#f5f0e6">'+g.icon+'</div>';
      html += '<div style="cursor:pointer" onclick="selectSong(\''+s.slug+'\')"><div style="border:1px solid #ddd;overflow:hidden"><div>'+cover+'</div><div style="padding:8px"><div style="font-weight:600;font-size:.75rem">'+esc(s.title)+'</div><div style="font-size:.6rem;color:#888;margin-top:2px">'+g.label+'</div></div></div></div>';
    } else {
      html += '<div style="border:1px dashed #ccc;padding:20px;text-align:center;color:#ccc"><div style="font-size:1.5rem">'+g.icon+'</div><div style="font-size:.6rem;margin-top:4px">'+g.label+'</div><div style="font-size:.55rem;color:#aaa">待生产</div></div>';
    }
  });
  html += '</div>';

  html += '<div class="detail-section" style="margin-top:24px"><div class="detail-section-title">曲风分布</div></div>';
  html += '<div class="table-wrap"><table><thead><tr><th>曲风</th><th>数量</th><th>占比</th><th>分布条</th></tr></thead><tbody>';
  GENRES.forEach(function(g){
    var count = allSongs.filter(function(s){return s.genre_code === g.code}).length;
    var pct = allSongs.length ? Math.round(count/allSongs.length*100) : 0;
    html += '<tr><td><span style="color:'+g.color+'">'+g.icon+' '+g.label+'</span></td><td>'+count+'</td><td>'+pct+'%</td><td><div style="background:#eee;height:12px;width:100%;max-width:200px"><div style="background:'+g.color+';height:12px;width:'+pct+'%"></div></div></td></tr>';
  });
  html += '</tbody></table></div>';

  return html;
}

function renderSongDetail() {
  if (!currentSlug) {
    // Table view
    var html = '<div class="table-wrap"><table><thead><tr><th></th><th>歌名</th><th>曲风</th><th>日期</th><th>BPM</th><th>和弦</th><th>时长</th><th>音频</th></tr></thead><tbody>';
    allSongs.forEach(function(s){
      var g = GENRES.find(function(x){return x.code === s.genre_code}) || {icon:'🍅',label:'',color:'#c41e1e'};
      html += '<tr style="cursor:pointer" onclick="selectSong(\''+s.slug+'\')"><td>';
      if (s.cover && s.cover.path) {
        html += '<div class="td-cover"><img src="/music/'+encodeURIComponent(getRelPath(s))+'"></div>';
      } else { html += '<div class="td-cover" style="display:flex;align-items:center;justify-content:center;background:#f5f0e6">'+g.icon+'</div>'; }
      html += '</td><td style="font-weight:600">'+esc(s.title)+'</td><td><span style="color:'+g.color+'">'+g.icon+' '+g.label+'</span></td><td>'+formatDate(s.date)+'</td><td>'+(s.bpm||'—')+'</td><td>'+(s.chord||'—')+'</td><td>'+(s.duration?fmtTime(s.duration):'—')+'</td><td>'+(s.mp3?'✅':'❌')+'</td></tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  var s = allSongs.find(function(x){return x.slug === currentSlug});
  if (!s) return '<div style="padding:40px;color:#888">未选择歌曲</div>';
  var g = GENRES.find(function(x){return x.code === s.genre_code}) || {icon:'🍅',label:'',color:'#c41e1e'};

  var coverHtml = s.cover && s.cover.path
    ? '<img src="/music/'+encodeURIComponent(getRelPath(s))+'">'
    : '<div class="detail-cover-ph">'+g.icon+'</div>';

  var html = '<div style="margin-bottom:12px"><button class="btn" onclick="currentSlug=null;renderTab();renderList()">← 返回列表</button></div>';
  html += '<div class="detail-grid"><div><div class="detail-cover">'+coverHtml+'</div>';
  if (s.mp3) {
    html += '<div class="audio-player"><audio controls src="'+s.mp3+'" style="width:100%"></audio></div>';
  }
  html += '</div><div class="detail-info">';
  html += '<h2>'+esc(s.title)+'</h2>';
  html += '<div class="detail-meta">';
  html += '<span class="meta-badge" style="background:'+g.color+'">'+g.icon+' '+g.label+'</span>';
  if (s.bpm) html += '<span class="meta-item">🎯 '+s.bpm+' BPM</span>';
  if (s.chord) html += '<span class="meta-item">🎵 '+esc(s.chord)+'</span>';
  if (s.duration) html += '<span class="meta-item">⏱ '+fmtTime(s.duration)+'</span>';
  if (s.date) html += '<span class="meta-item">📅 '+formatDate(s.date)+'</span>';
  html += '</div>';

  if (s.lyrics) {
    html += '<div class="detail-section"><div class="detail-section-title">歌词</div><div class="detail-lyrics">'+esc(s.lyrics)+'</div></div>';
  }

  html += '<div class="detail-section"><div class="detail-section-title">文件信息</div><div style="font-size:.7rem;color:#888;line-height:1.8">';
  html += '目录: '+esc(s.dir||'—')+'<br>';
  if (s.versions) {
    s.versions.forEach(function(v){
      html += '版本 '+v.version_tag+': '+v.filename+' ('+v.size_mb+'MB, '+v.platform+')<br>';
    });
  }
  html += '</div></div>';

  html += '</div></div>';
  return html;
}

function renderPipeline() {
  return '<div class="pipeline">'+
    '<div class="pipe-card ok"><div class="pipe-name">🍅 T-A 创作</div><div class="pipe-status">每日 08:00</div><div class="pipe-time">5 首/天</div><div class="pipe-next">5 种曲风歌词创作</div></div>'+
    '<div class="pipe-card ok"><div class="pipe-name">🎵 T-A\' 音频</div><div class="pipe-status">每日 08:30</div><div class="pipe-time">5 首 MP3</div><div class="pipe-next">mmx 生成 + 封面</div></div>'+
    '<div class="pipe-card ok"><div class="pipe-name">🖼️ T-B 后处理</div><div class="pipe-status">每日 09:00</div><div class="pipe-time">海报+LRC</div><div class="pipe-next">网站重建</div></div>'+
    '</div>'+
    '<div class="detail-section"><div class="detail-section-title">调度信息</div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>任务</th><th>Cron</th><th>说明</th><th>状态</th></tr></thead><tbody>'+
    '<tr><td>T-A · 创作</td><td>0 8 * * *</td><td>5 种曲风歌词 + tomato_audio.json</td><td style="color:#27ae60">✅ 已部署</td></tr>'+
